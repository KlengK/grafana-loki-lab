# Promtail — tails the demo web app's JSON access log and ships it to Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: webapp
    static_configs:
      - targets: [localhost]
        labels:
          job: webapp
          __path__: /var/log/webapp/access.log
    pipeline_stages:
      # Parse the JSON line so fields become available for LogQL.
      - json:
          expressions:
            method: method
            path: path
            status: status
            ip: ip
      # Promote a few low-cardinality fields to labels for fast filtering.
      - labels:
          method:
          status:
